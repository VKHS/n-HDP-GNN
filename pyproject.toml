[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nhdp-gnn"
version = "2.1.0"
description = "n-HDP-GNN: community-aware Bayesian clustering for over-smoothing-resilient, communication-efficient distributed GNNs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Abdolvahab Khalili Sadaghiani" },
  { name = "Jose Nunez-Yanez" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "networkx>=3.0",
]

[project.optional-dependencies]
# torch >= 2.3 (older torch fails on NumPy 2 arrays); PyG >= 2.6 (older PyG cannot
# load its processed datasets under torch >= 2.6, which defaults to weights_only)
gnn = ["torch>=2.3", "torch_geometric>=2.6"]
ogb = ["ogb>=1.3.6"]
fast = ["pymetis>=2023.1", "igraph>=0.10"]
figures = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.urls]
Article = "https://doi.org/10.1007/s11227-025-08017-9"
Repository = "https://github.com/VKHS/n-HDP-GNN"

[tool.setuptools.packages.find]
include = ["nhdp_gnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
