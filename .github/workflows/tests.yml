name: tests

on:
  push:
    branches-ignore: ["reproduce/**", "results/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric ogb
          pip install -e ".[test,figures]"
          python -c "import torch, torch_geometric; print('torch', torch.__version__, 'pyg', torch_geometric.__version__)"
      - uses: actions/cache@v4
        with:
          path: data
          key: datasets-v1-${{ hashFiles('nhdp_gnn/data.py') }}
          restore-keys: datasets-v1-
      - name: Tests
        run: pytest -q -rs --durations=15
