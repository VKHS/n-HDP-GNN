name: determinism

# Does a run repeat bit for bit?  Each of eight jobs, on a runner of its own, trains one
# configuration (n-HDP-GNN by default) twice per seed in separate processes with the
# default kernel selection and twice with the instruction set pinned
# (scripts/check_reproducibility.py), and prints one RESULT line per run with the runner's
# CPU model, so that jobs that landed on different CPUs can be compared.  The job log ends
# with a summary of which repeats and which variants agree.
#
# Start it by hand: Actions tab -> "determinism" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "dataset"
        default: "cora"
      seeds:
        description: "seeds, space separated"
        default: "0 1"
      repeats:
        description: "runs per seed and variant"
        default: "2"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
          pip install -e .
      - name: Machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Vendor'
      - name: Repeat the runs
        env:
          DATASET: ${{ inputs.dataset }}
          SEEDS: ${{ inputs.seeds }}
          REPEATS: ${{ inputs.repeats }}
        run: python scripts/check_reproducibility.py --dataset "$DATASET" --seeds $SEEDS --repeats "$REPEATS"
