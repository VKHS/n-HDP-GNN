name: reproduce

# Runs one sweep (a table or figure of the article) on GitHub-hosted CPU runners,
# then aggregates the per-run results with scripts/make_tables.py.
#
# Start it in either of two ways:
#   * Actions tab -> "reproduce" -> "Run workflow" (choose the sweep file), or
#     gh workflow run reproduce.yml -f config=configs/table1_ablation.toml
#   * push any commit to a branch named reproduce/<sweep name>, e.g.
#     git push origin HEAD:reproduce/table1_ablation   (runs configs/table1_ablation.toml)
#
# Every job runs its share of the sweep with `nhdp_gnn.sweep --workers 4`: one
# process per run, four at a time (one per vCPU, one thread each), within a memory
# budget of 13 GB of the runner's 16 GB.  A run that does not fit next to the others
# is repeated on its own; a run that needs more than the budget alone, or whose
# training provably needs more than the time limit, is recorded as failed (memory
# or time) and reported as such in the tables.  The sweep file's optional [actions]
# table sets the selection (`only`, e.g. to leave out graphs that need a cluster),
# `runs_per_job`, `memory_gb` and `run_minutes`.
#
# Results are uploaded as the artifact "results-<sweep name>" and, if publish is
# true, pushed to the branch results/<sweep name> (one commit containing only the
# results/ directory).  Multi-node scaling (Tables 9-12) and OGB-scale runs need a
# cluster: see scripts/launch_cluster.sh and docs/REPRODUCING.md.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "sweep file, e.g. configs/table1_ablation.toml"
        required: true
        default: "configs/table1_ablation.toml"
      jobs:
        description: "parallel jobs (empty: from runs_per_job in the sweep's [actions] table, default 16 runs per job)"
        required: false
        default: ""
      only:
        description: "optional filter, e.g. dataset=cora,seed=0|1|2 (empty: the sweep's [actions] only)"
        required: false
        default: ""
      set:
        description: "optional overrides, space separated key=value (e.g. epochs=200)"
        required: false
        default: ""
      publish:
        description: "push results to branch results/<sweep name>"
        type: boolean
        default: true
      fresh:
        description: "ignore the results already on branch results/<sweep name> (default: runs recorded there are not repeated)"
        type: boolean
        default: false
  push:
    branches: ["reproduce/**"]

permissions:
  contents: write

concurrency:
  group: reproduce-${{ github.ref_name }}-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      name: ${{ steps.plan.outputs.name }}
      config: ${{ steps.plan.outputs.config }}
      only: ${{ steps.plan.outputs.only }}
      set: ${{ steps.plan.outputs.set }}
      memory_gb: ${{ steps.plan.outputs.memory_gb }}
      run_minutes: ${{ steps.plan.outputs.run_minutes }}
      publish: ${{ steps.plan.outputs.publish }}
      fresh: ${{ steps.plan.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CONFIG: ${{ inputs.config }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_ONLY: ${{ inputs.only }}
          IN_SET: ${{ inputs.set }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_FRESH: ${{ inputs.fresh }}
        run: |
          python - <<'EOF'
          import json, math, os, tomllib
          from nhdp_gnn.sweep import expand, select
          push = os.environ["EVENT"] == "push"
          config = (f"configs/{os.environ['REF_NAME'].removeprefix('reproduce/')}.toml" if push
                    else os.environ["IN_CONFIG"])
          spec = tomllib.load(open(config, "rb"))
          actions = spec.get("actions", {})
          only = (os.environ.get("IN_ONLY", "") if not push else "") or actions.get("only", "")
          n_runs = len(select(expand(spec), dict(kv.split("=", 1) for kv in only.split(",") if kv)))
          per_job = int(actions.get("runs_per_job", 16))
          jobs = os.environ.get("IN_JOBS", "") if not push else ""
          jobs = max(1, min(256, int(jobs) if jobs.strip() else math.ceil(n_runs / per_job)))
          out = {"matrix": json.dumps({"job": list(range(jobs))}), "jobs": str(jobs), "name": spec["name"],
                 "config": config, "only": only, "set": "" if push else os.environ.get("IN_SET", ""),
                 "memory_gb": str(actions.get("memory_gb", 13)), "run_minutes": str(actions.get("run_minutes", 150)),
                 "publish": "true" if push else os.environ.get("IN_PUBLISH", "true"),
                 "fresh": "false" if push else os.environ.get("IN_FRESH", "false") or "false"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          print(f"{config}{' --only ' + only if only else ''}: {n_runs} runs, {jobs} jobs")
          EOF

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CONFIG: ${{ needs.plan.outputs.config }}
      ONLY: ${{ needs.plan.outputs.only }}
      SET: ${{ needs.plan.outputs.set }}
      SHARD: ${{ matrix.job }}/${{ needs.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric ogb
          pip install -e .
      - uses: actions/cache@v4
        with:
          path: data
          key: datasets-v2-${{ needs.plan.outputs.name }}-${{ hashFiles('nhdp_gnn/data.py') }}
          restore-keys: |
            datasets-v2-${{ needs.plan.outputs.name }}-
            datasets-v1-
      - name: Datasets
        continue-on-error: true            # a dataset that fails to load fails its runs, not the others
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          python -m nhdp_gnn.sweep "$CONFIG" --shard "$SHARD" "${args[@]}" --prefetch
      - name: Earlier results
        if: needs.plan.outputs.fresh != 'true'
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          # a sweep that ran before continues: runs recorded on its results branch are not repeated
          if git fetch -q --depth 1 origin "results/$NAME" 2>/dev/null; then
            mkdir -p /tmp/earlier && git archive FETCH_HEAD "results/$NAME" | tar -x -C /tmp/earlier
            python scripts/unpack_results.py "/tmp/earlier/results/$NAME" previous
          else
            echo "no branch results/$NAME: the sweep starts from scratch"
          fi
      - name: Runs
        env:
          MEMORY_GB: ${{ needs.plan.outputs.memory_gb }}
          RUN_MINUTES: ${{ needs.plan.outputs.run_minutes }}
        run: |
          # without swap, memory pressure ends in the kernel's out-of-memory killer (which picks a run,
          # handled by the sweep) instead of thrashing until the runner is lost
          sudo swapoff -a || true
          free -m
          args=(--set threads=1 --shard "$SHARD" --workers 4 --memory-gb "$MEMORY_GB" --run-minutes "$RUN_MINUTES"
                --deadline-minutes 330)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -d previous ] && args+=(--previous previous)
          for kv in $SET; do args+=(--set "$kv"); done
          python -m nhdp_gnn.sweep "$CONFIG" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ matrix.job }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [plan, sweep]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: collected
          merge-multiple: true
      - name: Earlier results
        if: needs.plan.outputs.fresh != 'true'
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          # a sweep that ran before continues: runs recorded on its results branch are not repeated
          if git fetch -q --depth 1 origin "results/$NAME" 2>/dev/null; then
            mkdir -p /tmp/earlier && git archive FETCH_HEAD "results/$NAME" | tar -x -C /tmp/earlier
            python scripts/unpack_results.py "/tmp/earlier/results/$NAME" previous
          else
            echo "no branch results/$NAME: the sweep starts from scratch"
          fi
      - name: Tables
        env:
          CONFIG: ${{ needs.plan.outputs.config }}
          ONLY: ${{ needs.plan.outputs.only }}
          SET: ${{ needs.plan.outputs.set }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          for kv in $SET; do args+=(--set "$kv"); done
          mkdir -p collected
          [ -d previous ] && args+=(--runs previous)          # records of this run take precedence
          rm -rf "results/$NAME"                              # the copy in the checkout, if any
          python scripts/make_tables.py "$CONFIG" --runs collected --out "results/$NAME" "${args[@]}"
          cat "results/$NAME/README.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ needs.plan.outputs.name }}
          path: results/${{ needs.plan.outputs.name }}/
          retention-days: 90
      - name: Publish to results branch
        if: needs.plan.outputs.publish == 'true'
        env:
          NAME: ${{ needs.plan.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r "results/$NAME" /tmp/sweep-results
          git checkout --orphan "results/$NAME"
          git rm -rq --cached .
          git clean -fdxq
          rm -rf results && mkdir -p results && cp -r /tmp/sweep-results "results/$NAME"
          git add results
          git commit -qm "Results of $NAME from $GITHUB_SHA ($RUN_URL)"
          git push -f origin "results/$NAME"
