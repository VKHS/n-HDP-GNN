name: reproduce

# Runs one sweep (a table or figure of the article) on GitHub-hosted CPU runners,
# then aggregates the per-run results with scripts/make_tables.py.
#
# Start it in either of two ways:
#   * Actions tab -> "reproduce" -> "Run workflow" (choose the sweep file), or
#     gh workflow run reproduce.yml -f config=configs/table1_ablation.toml
#   * push any commit to a branch named reproduce/<sweep name>, e.g.
#     git push origin HEAD:reproduce/table1_ablation   (runs configs/table1_ablation.toml)
#
# Each job runs 4 sweep shards in parallel (one per vCPU, one thread each).  The
# number of jobs defaults to one per 20 runs (at most 256).  Results are uploaded
# as the artifact "results-<sweep name>" and, if publish is true, pushed to the
# branch results/<sweep name> (one commit containing only the results/ directory).
# Multi-node scaling (Tables 9-12) and OGB-scale runs need a cluster: see
# scripts/launch_cluster.sh and docs/REPRODUCING.md.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "sweep file, e.g. configs/table1_ablation.toml"
        required: true
        default: "configs/table1_ablation.toml"
      jobs:
        description: "parallel jobs, each running 4 shards (empty: one per 20 runs, at most 256)"
        required: false
        default: ""
      only:
        description: "optional filter, e.g. dataset=cora,seed=0|1|2"
        required: false
        default: ""
      set:
        description: "optional overrides, space separated key=value (e.g. epochs=200)"
        required: false
        default: ""
      publish:
        description: "push results to branch results/<sweep name>"
        type: boolean
        default: true
  push:
    branches: ["reproduce/**"]

permissions:
  contents: write

concurrency:
  group: reproduce-${{ github.ref_name }}-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      name: ${{ steps.plan.outputs.name }}
      config: ${{ steps.plan.outputs.config }}
      shards: ${{ steps.plan.outputs.shards }}
      only: ${{ steps.plan.outputs.only }}
      set: ${{ steps.plan.outputs.set }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CONFIG: ${{ inputs.config }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_ONLY: ${{ inputs.only }}
          IN_SET: ${{ inputs.set }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'EOF'
          import json, math, os, tomllib
          push = os.environ["EVENT"] == "push"
          config = (f"configs/{os.environ['REF_NAME'].removeprefix('reproduce/')}.toml" if push
                    else os.environ["IN_CONFIG"])
          spec = tomllib.load(open(config, "rb"))
          n_runs = math.prod(len(v) for v in spec.get("grid", {}).values()) * max(1, len(spec.get("variant", [])))
          jobs = os.environ.get("IN_JOBS", "") if not push else ""
          jobs = max(1, min(256, int(jobs) if jobs.strip() else math.ceil(n_runs / 20)))
          publish = "true" if push else os.environ.get("IN_PUBLISH", "true")
          out = {"matrix": json.dumps({"job": list(range(jobs))}), "name": spec["name"], "config": config,
                 "shards": str(4 * jobs), "only": "" if push else os.environ.get("IN_ONLY", ""),
                 "set": "" if push else os.environ.get("IN_SET", ""), "publish": publish}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          print(f"{config}: {n_runs} runs, {jobs} jobs x 4 shards")
          EOF

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric ogb
          pip install -e .
      - uses: actions/cache@v4
        with:
          path: data
          key: datasets-v1-${{ hashFiles('nhdp_gnn/data.py') }}
          restore-keys: datasets-v1-
      - name: Run 4 shards
        env:
          CONFIG: ${{ needs.plan.outputs.config }}
          ONLY: ${{ needs.plan.outputs.only }}
          SET: ${{ needs.plan.outputs.set }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          JOB: ${{ matrix.job }}
        run: |
          args=(--set threads=1)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          for kv in $SET; do args+=(--set "$kv"); done
          status=0
          for j in 0 1 2 3; do
            # stop before the job limit so that finished runs are still uploaded
            timeout --signal=INT 330m python -m nhdp_gnn.sweep "$CONFIG" --shard $((4 * JOB + j))/"$SHARDS" \
              "${args[@]}" > "shard-$j.log" 2>&1 &
          done
          for j in 0 1 2 3; do wait -n || status=1; done
          tail -n 3 shard-*.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ matrix.job }}
          path: |
            runs/
            shard-*.log
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    needs: [plan, sweep]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: collected
          merge-multiple: true
      - name: Tables
        env:
          CONFIG: ${{ needs.plan.outputs.config }}
          ONLY: ${{ needs.plan.outputs.only }}
          SET: ${{ needs.plan.outputs.set }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          for kv in $SET; do args+=(--set "$kv"); done
          mkdir -p collected/runs
          python scripts/make_tables.py "$CONFIG" --runs collected/runs --out "results/$NAME" "${args[@]}"
          cat "results/$NAME/README.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ needs.plan.outputs.name }}
          path: results/
          retention-days: 90
      - name: Publish to results branch
        if: needs.plan.outputs.publish == 'true'
        env:
          NAME: ${{ needs.plan.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r results /tmp/results
          git checkout --orphan "results/$NAME"
          git rm -rq --cached .
          git clean -fdxq
          mkdir -p results && cp -r /tmp/results/. results/
          git add results
          git commit -qm "Results of $NAME from $GITHUB_SHA ($RUN_URL)"
          git push -f origin "results/$NAME"
