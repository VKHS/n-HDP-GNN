name: diag-ddp
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      OMP_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
          pip install -e .
          python -c "import torch; print('torch', torch.__version__)"; lscpu | grep 'Model name'
      - name: Four ranks, 25 rounds of the old and the new exit
        run: python diag_ddp.py 4 25 ${{ matrix.shard }}
